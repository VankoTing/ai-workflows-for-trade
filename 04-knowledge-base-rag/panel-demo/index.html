<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>企业知识库 · 控制面板（演示版）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:#f6f8fb;color:#0f172a;font-size:14px;line-height:1.65}
.wrap{max-width:960px;margin:0 auto;padding:0 22px}
header{background:#0f172a;color:#e2e8f0;padding:26px 0 22px;margin-bottom:18px}
header h1{font-size:21px;color:#fff;font-weight:500}
header p{color:#94a3b8;font-size:13px;margin-top:5px}
.demo{max-width:960px;margin:0 auto 4px;padding:0 22px}
.demoin{background:#fffbeb;border:1px solid #fcd34d;border-left:4px solid #f59e0b;
  border-radius:0 10px 10px 0;padding:11px 15px;font-size:12.5px;color:#78350f;margin-bottom:20px}
.demoin b{color:#92400e}
h2{font-size:15px;font-weight:500;margin:26px 0 12px;display:flex;align-items:center;gap:8px}
h2:before{content:"";width:4px;height:15px;background:#2563eb;border-radius:2px}
.ask{background:#fff;border:1px solid #e6ebf2;border-radius:12px;padding:14px 16px;margin-bottom:6px}
.ask label{font-size:12.5px;color:#64748b;display:block;margin-bottom:6px}
.ask input{width:100%;padding:9px 12px;border:1px solid #d8e0ea;border-radius:8px;font-size:13.5px;
  font-family:inherit;outline:none}
.grid{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:#fff;border:1px solid #e6ebf2;border-radius:11px;padding:13px 15px;
  display:flex;flex-direction:column;gap:9px}
.card.warn{border-color:#f0c9a0;background:#fffaf4}
.card .tn{font-size:13.5px;font-weight:500}
.card .td{font-size:12.5px;color:#64748b;flex:1}
button{border:none;background:#2563eb;color:#fff;padding:7px 16px;border-radius:7px;
  font-size:13px;font-family:inherit;cursor:pointer;align-self:flex-start}
button:hover{background:#1d4ed8}
.card.warn button{background:#d97706}
button.ghost{background:#eef2f7;color:#475569}
.job{background:#fff;border:1px solid #e6ebf2;border-radius:10px;padding:10px 14px;margin-bottom:8px}
.job summary{cursor:pointer;font-size:13px;font-weight:500;list-style:none}
.job summary::-webkit-details-marker{display:none}
.job summary:before{content:"▸";color:#94a3b8;margin-right:7px;display:inline-block;transition:transform .15s}
.job[open] summary:before{transform:rotate(90deg)}
.job pre{margin-top:9px;background:#0f172a;color:#cbd5e1;border-radius:8px;padding:11px 13px;
  font-size:12px;line-height:1.55;font-family:Consolas,Monaco,monospace;
  max-height:420px;overflow:auto;white-space:pre-wrap;word-break:break-all}
.empty{color:#94a3b8;font-size:13px;padding:10px 2px}
footer{color:#94a3b8;font-size:12.5px;padding:26px 0 44px;text-align:center}
.badge{font-size:11.5px;padding:1px 8px;border-radius:20px;background:#eef2f7;color:#475569;margin-left:6px}
.badge.running{background:#dbeafe;color:#1d4ed8}
.badge.done{background:#dcfce7;color:#15803d}
.tag{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:20px;
  background:#fef3c7;color:#92400e;margin-left:8px;font-weight:400}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>企业知识库 · 控制面板 <span class="tag">演示版</span></h1>
  <p>外贸资料知识库系统　|　点按钮可查看真实运行时的输出效果</p>
</div></header>

<div class="demo"><div class="demoin">
  <b>这是演示版。</b>真实系统运行在本地电脑上（资料只在本机处理、不上传）。
  本页面<strong>不含任何客户信息、报价或合同内容</strong>，仅展示系统运作方式与产品公开参数。
  按钮输出为<strong>真实运行日志的节选</strong>，逐行回放。
</div></div>

<div class="wrap">

  <div class="ask">
    <label>「知识库问答」使用的问题（可以改）</label>
    <input id="question" value="球阀的工作压力和温度范围是多少？适用哪些标准？">
  </div>

  <h2>可执行的操作</h2>
  <div class="grid" id="tasks"></div>

  <h2>运行日志
    <button class="ghost" id="clear" style="margin-left:auto;font-size:12px;padding:4px 12px">清空</button>
  </h2>
  <div id="jobs"><div class="empty">还没有运行任何任务。点上面的按钮试试。</div></div>

  <footer>演示版 · 真实系统为本地部署，数据不出本机</footer>
</div>

<script>
const $ = s => document.querySelector(s);

const TASKS = [
  {
    id: "env", name: "环境自检", desc: "检查 Python / GPU / Ollama / 资料目录",
    out: [
      "===== 环境自检 =====",
      "",
      "Python       3.13.12                    ✅",
      "虚拟环境     envs/default                ✅",
      "显卡         NVIDIA GeForce RTX 4060（8 GB）  ✅",
      "CUDA         onnxruntime-gpu 1.22        ✅",
      "Ollama       已安装，服务运行中           ✅",
      "  生成模型   qwen2.5:7b                  ✅",
      "  向量模型   bge-m3                      ✅",
      "",
      "资料目录     D:\\RAG资料",
      "  文件总数   2211",
      "  总体积     4.56 GB",
      "  PDF        855     Excel  487",
      "  Word       131     图片   629",
      "",
      "全部就绪，可以开始工作。"
    ]
  },
  {
    id: "parse", name: "解析预览", desc: "看前 20 个文件能不能抽出文字、哪些需要 OCR",
    out: [
      "解析预览（目录：产品资料，前 20 个文件）",
      "",
      "文件                                类型    页     字数   判定",
      "Actuators & Positioner.pdf          pdf    14    15484   ✅ 文本型",
      "Ball Valve(2).pdf                   pdf    23     9708   ⚠️ 扫描件，需要 OCR",
      "Ball Valve(3).pdf                   pdf    23     9654   ⚠️ 扫描件，需要 OCR",
      "Brochure_该企业_Union_Product.pdf     pdf    15    21609   ✅ 文本型",
      "Gate Valve1.pdf                     pdf    28    55995   ⚠️ 多为页眉噪音",
      "...",
      "",
      "本次样本中，需要 OCR 的扫描件：6 / 20",
      "→ 图片型 PDF 必须先 OCR 才能进知识库。"
    ]
  },
  {
    id: "ocr", name: "OCR 单文件测试", desc: "拿球阀 PDF 试一下，看能认出多少参数",
    out: [
      "逐页 OCR · Ball Valve(2).pdf",
      "",
      "    第   1 页  text    1204 字",
      "    第   2 页  text     986 字",
      "    第   3 页  ocr     1873 字",
      "    第   4 页  ocr     1655 字",
      "    ...（中间省略）...",
      "    第  22 页  ocr     1421 字",
      "    第  23 页  ocr      980 字",
      "",
      "  总页数 23｜其中 OCR 21 页｜设备 GPU｜耗时 106.3 秒",
      "  抽出 66782 字（去重后 21695）｜规格关键词命中 15 个",
      "",

      "  GKV-243 · 3-WAY/4-WAY FULL BORE FLANGE END BALL VALVE",
      "  DN100~DN150(4\"~6\")",
      "  PN16/40, Class150",
      "  TEMPERATURE RANGE: -20 to 180",
      "  BODY  CF8M/CF8/WCB",
      "  TEST: EN-12266-1",
      "",
      "（这些参数原先完全抽不到 —— 它们藏在图片里）"
    ]
  },
  {
    id: "index_small", name: "入库 · 小样本（8 个文件）", desc: "安全试跑，验证流程通不通",
    out: [
      "入库目录：D:\\RAG资料\\产品资料",
      "待处理文件：8 个",
      "",
      "并行进程数：6（OCR 走 CPU）｜每进程限 2 线程（共 12 线程）",
      "",
      "  [1/8] ✓ Actuators & Positioner(1).pdf     79 块  [public] ⟳ OCR 11/14 页",
      "  [2/8] ✓ Actuators & Positioner.pdf        79 块  [public] ⟳ OCR 11/14 页",
      "  [3/8] ✓ Ball Valve(2).pdf                 55 块  [public] ⟳ OCR 21/23 页",
      "  [4/8] ✓ Ball Valve(3).pdf                 53 块  [public] ⟳ OCR 21/23 页",
      "  [5/8] ✓ ball valve.pdf                    10 块  [public] ⟳ OCR 3/3 页",
      "  [6/8] ✓ ball valve4.pdf                    9 块  [public] ⟳ OCR 3/3 页",
      "  [7/8] ✓ Butterfly valve.pdf               26 块  [public] ⟳ OCR 2/13 页",
      "  [8/8] ✓ Brochure_Product-Range.pdf        39 块  [public] ⟳ OCR 2/15 页",
      "",
      "==============================================================",
      "完成：8 个文件入库 / 345 个切片 / 跳过 0 / 失败 0",
      "其中 OCR 抢救：8 个文件 / 74 页（设备 CPU）",
      "耗时 285.1 秒，向量库现有 345 个切片",
      "",
      "（每段都带元数据标签：来源 / 密级 / 负责人 —— 这是权限过滤的依据）"
    ]
  },
  {
    id: "index_all", name: "入库 · 全量（855 个 PDF）", desc: "预计 4~5 小时，中断后可重跑续上",
    warn: true,
    out: [
      "⚠️ 该操作会处理全部 855 个 PDF，预计耗时 4~5 小时。",
      "",
      "（演示版不实际执行；真实环境下 OCR 结果有缓存，",
      "  中断后重跑会自动续上，不会重复识别。）",
      "",
      "运行时的样子：",
      "并行进程数：6｜每进程限 2 线程",
      "  [  1/855] ✓ Actuators & Positioner(1).pdf    79 块  [public] ⟳ OCR 11/14 页",
      "  [  2/855] ✓ Actuators & Positioner.pdf       79 块  [public] ⟳ OCR 11/14 页",
      "  ...",
      "  [855/855] ✓ ...",
      "",
      "完成：812 个文件入库 / 约 4.2 万个切片"
    ]
  },
  {
    id: "ask", name: "知识库问答", desc: "在下面输入问题，问你的产品资料",
    input: true,
    out: [
      "知识库共 345 个切片 | 角色=gm | 过滤条件=None",
      "",
      "==============================================================",
      "回答",
      "==============================================================",
      "球阀的工作压力范围为 1000psi，温度范围为 -20 至 180°C。",
      "适用的标准包括 ANSI B1.20.1(NPT) 和 BSPT(PT)、BSP(BF)。",
      "",
      "==============================================================",
      "引用来源",
      "==============================================================",
      "  [1] 产品资料/Ball Valve(2).pdf   （密级：public）",
      "  [2] 产品资料/Ball Valve(3).pdf   （密级：public）",
      "",
      "（回答必须带出处，避免模型凭空编造 —— 这是防幻觉的关键设计）"
    ]
  },
  {
    id: "dashboard", name: "重新生成看板", desc: "重新读取项目数据，刷新进度看板",
    out: [
      "看板已生成：D:\\rag-system\\dashboard\\index.html",
      "  资料 2211 文件 / 4.56 GB",
      "  向量库 345 切片（读取成功）",
      "  复盘教训 15 条",
      "",
      "看板内容：流水线进度 · 排查历程 · 复盘教训 · 向量库密级分布 · 资料构成"
    ]
  },
  {
    id: "open_board", name: "打开进度看板", desc: "查看流水线进度与复盘教训",
    out: ["（演示版：真实环境会打开本地进度看板页面）"]
  },
  {
    id: "open_folder", name: "打开项目文件夹", desc: "用资源管理器打开项目目录",
    out: ["（演示版：真实环境会打开资源管理器，定位到项目目录）"]
  }
];

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

function renderTasks() {
  $('#tasks').innerHTML = TASKS.map(t =>
    '<div class="card' + (t.warn ? ' warn' : '') + '">' +
      '<div class="tn">' + esc(t.name) + '</div>' +
      '<div class="td">' + esc(t.desc) + '</div>' +
      '<button data-id="' + t.id + '">运行</button>' +
    '</div>').join('');
}

async function run(id) {
  const t = TASKS.find(x => x.id === id);
  if (!t) return;

  const box = $('#jobs');
  const hint = box.querySelector('.empty');
  if (hint) hint.remove();

  const el = document.createElement('details');
  el.className = 'job';
  el.open = true;                 // 默认展开，且永不自动收起
  el.innerHTML = '<summary>' + esc(t.name) +
    '<span class="badge running">运行中</span></summary><pre></pre>';
  box.appendChild(el);
  el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  const pre = el.querySelector('pre');
  const badge = el.querySelector('.badge');

  for (const line of t.out) {
    pre.textContent += line + '\n';
    pre.scrollTop = pre.scrollHeight;
    await sleep(35);
  }

  badge.className = 'badge done';
  badge.textContent = '完成';
}

document.addEventListener('click', e => {
  const b = e.target.closest('#tasks button');
  if (b) run(b.dataset.id);
});

$('#clear').addEventListener('click', () => {
  $('#jobs').innerHTML = '<div class="empty">还没有运行任何任务。点上面的按钮试试。</div>';
});

renderTasks();
</script>
</body>
</html>
